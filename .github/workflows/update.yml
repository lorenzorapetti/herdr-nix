name: Update inputs and plugins

on:
  schedule:
    - cron: "0 5 */2 * *"
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Pull only: pushing is left to the build workflow on main.
      - uses: cachix/cachix-action@v17
        with:
          name: herdr-nix
          skipPush: true

      - name: Update flake inputs
        run: |
          nix flake update 2>&1 | tee inputs.log
          grep -E "^• Updated input" inputs.log | sed "s/^• //" > inputs.txt || true

      - name: Update plugins
        id: plugins
        continue-on-error: true
        run: ./scripts/update-plugins.sh | tee plugins.txt

      - name: Check
        id: check
        continue-on-error: true
        run: nix flake check -L

      - name: Write pull request body
        run: |
          {
            if [ -s inputs.txt ]; then
              echo "### Flake inputs"
              echo
              sed "s/^/- /" inputs.txt
              echo
            fi
            if [ -s plugins.txt ]; then
              echo "### Plugins"
              echo
              sed "s/^/- /" plugins.txt
              echo
            fi
            if [ "${{ steps.plugins.outcome }}" != success ]; then
              echo "> [!WARNING]"
              echo "> Some plugins failed to update; see the [workflow run]($RUN_URL)."
              echo
            fi
            if [ "${{ steps.check.outcome }}" != success ]; then
              echo "> [!CAUTION]"
              echo "> \`nix flake check\` failed; see the [workflow run]($RUN_URL)."
            fi
          } > body.md
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: update/inputs-and-plugins
          delete-branch: true
          commit-message: Update flake inputs and plugins
          title: Update flake inputs and plugins
          body-path: body.md
          add-paths: |
            flake.lock
            pkgs/

      - name: Fail on update or check errors
        if: steps.plugins.outcome != 'success' || steps.check.outcome != 'success'
        run: exit 1
